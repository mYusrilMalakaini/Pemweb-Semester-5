<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-card">
        <div class="login-header">
            <h1>PC Parts Store</h1>
            <p>Masuk untuk melihat komponen PC</p>
        </div>

        <form action="#" method="POST" class="login-form">
            <div class="form-group">
                <label for="form-username" class="title-form">Username</label>
                <input type="text" name="Username" id="form-username" placeholder="Nama Pengguna">
            </div>

            <div class="form-group">
                <label for="password" class="title-form">Password</label>
                <input type="password" name="password" id="password" placeholder="Kata Sandi">
            </div>

            <button type="submit" class="btn-submit">MASUK</button>
        </form>
    </main>
</body>
</html>
