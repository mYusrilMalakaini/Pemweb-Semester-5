<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light ">
        <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">RUANG BACAS</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavNav" aria-controls="navbarNavNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="#">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">Tentang</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">Bantuan</a></li>
                    </ul>
                </div>
            </div>
        </nav>

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">

        <div class="col-11 col-md-5 col-lg-4">
            <div class="card shadow border-0 p-4">
                <div class="card-body">
                    <h3 class="text-center fw-bold mb-1">Masuk Ke Ruang Baca</h3>
                    <p class="text-center ">Temukan bacaan untuk hari ini.</p>
                    <form>
                        <div class="mb-3">
                            <label for="username" class="form-label text-secondary small fw-bold">username</label>
                            <input type="text" class="form-control" id="username" placeholder="Masukan Username">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label text-secondary small fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Masukan password">
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label small text-muted" for="rememberMe">Ingatkan saya</label>
                        </div>

                        <div>
                            <button type="submit" class="btn btn-success w-100 fw-bold mb-3">MASUK</button>
                        </div>
                        <hr>

                        <div class="text-center">
                            <a href="#" class="text-decoration-none small text-success">Lupa Password?</a>
                        </div>
                    </form>
                </div>
            </div>
    </div>    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
