<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel HTML - Pola P</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff; /* Background putih menyamarkan border sel kosong */
        }
    </style>
</head>
<body>

    <table border="2" bordercolor="white" cellspacing="0" cellpadding="0">
        <!-- Baris 1 -->
        <tr>
            <td bgcolor="blue" rowspan="7" width="50" height="350"></td>
            <td bgcolor="blue" colspan="4" width="200" height="50"></td>
        </tr>
        
        <!-- Baris 2 -->
        <tr>
            <td bgcolor="#00FF00" width="50" height="50"></td>
            <td bgcolor="#00FF00" colspan="2" rowspan="2" width="100" height="100"></td>
            <td bgcolor="blue" rowspan="2" width="50" height="100"></td>
        </tr>
        
        <!-- Baris 3 -->
        <tr>
            <td width="50" height="50"></td>
        </tr>
        
        <!-- Baris 4 -->
        <tr>
            <td bgcolor="blue" width="50" height="50"></td>
            <td width="50" height="50"></td>
            <td bgcolor="blue" width="50" height="50"></td>
            <td width="50" height="50"></td>
        </tr>
        
        <!-- Baris 5 -->
        <tr>
            <td colspan="4" height="50"></td>
        </tr>
        
        <!-- Baris 6 -->
        <tr>
            <td colspan="4" height="50"></td>
        </tr>
        
        <!-- Baris 7 -->
        <tr>
            <td colspan="4" height="50"></td>
        </tr>
    </table>

</body>
</html>
