<!DOCTYPE html>
<html>
<head>
    <title>NIM_Soal1</title>
    <link type="text/css" rel="stylesheet" href="style1.css">
</head>
<body>
    <form>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" class="form-control" id="nama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" class="form-control" id="nim" readonly>
        </div>
    </form>

    <script type="text/javascript">
        let inputNim = prompt("Masukkan nim kamu:");
        let inputNama = prompt("Masukkan nama kamu:");

        // Masukkan nilai inputan ke elemen form berdasarkan ID
        if (inputNama) {
            document.getElementById("nama").value = inputNama;
        }
        if (inputNim) {
            document.getElementById("nim").value = inputNim;
        }
    </script>
</body>
</html>
