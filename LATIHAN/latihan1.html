
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Todo List</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <div class="list-title">
            <h2>Awesome Todo List</h2>
        </div>
    
        <div class="list-tugas">
            <input
                id="inputTugas"
                type="text"
                placeholder="What do you need to do today?"
            >
            <button id="tombolAdd">ADD</button>
        </div>
    
        <!-- Tempat menampilkan daftar tugas -->
        <ul id="daftarTugas"></ul>
    </div>

    <!-- Menghubungkan file JavaScript -->
    <script src="latihan1.js"></script>

</body>
</html>
